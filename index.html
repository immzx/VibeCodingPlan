{g:"apple",n:"液态湖光",d:"更柔和的玻璃边缘与青蓝折射感，强调筛选效率和高密度浏览。",mode:"sidebar",glass:true,accent:"#abdcff",accentInk:"#113149",surface:"#08151c",device:"#0d1c24",ink:"#f3f9fb",sub:"#acc2ce",panel:"rgba(199,229,244,.11)",panel2:"rgba(222,241,250,.19)",stroke:"rgba(255,255,255,.2)",radius:"15px",brand:"湖光",title:"自然作品库。",tags:["液态材质","筛选","高密度"]},
{g:"apple",n:"视觉空间",d:"融合 Apple TV 与 visionOS 的精选体验，主视觉与推荐内容并列。",mode:"hero",glass:true,accent:"#f0d2ff",accentInk:"#321841",surface:"#0d0b14",device:"#11101a",ink:"#faf6fc",sub:"#c0b5c8",panel:"rgba(232,217,246,.11)",panel2:"rgba(246,232,255,.19)",stroke:"rgba(255,255,255,.21)",radius:"15px",brand:"视觉空间",title:"静谧的光谱。",tags:["Apple TV","精选","高端品牌"]}
];
const groupInfo={basic:["basic","基础视觉","8 套非毛玻璃视觉方向"],glass:["glass","毛玻璃体系","1 套原型 + 5 套延展方向"],apple:["apple","Apple 毛玻璃体系","5 套 Apple 设计语言方向"]};
const nav=(s)=>`<div class="status"><span>9:41</span><span>● ● ▰</span></div><div class="nav"><span class="brand">${s.brand}</span><div class="actions"><span class="round">⌕</span><span class="round">···</span></div></div>`;
const bottom=(s)=>`<div class="${s.glass?"glass ":""}bottom"><b>作品</b><span>系列</span><span>收藏</span><span>我的</span></div>`;
const fallback="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=86";
const pics=(count,offset=0)=>Array.from({length:count},(_,i)=>`<img class="photo" src="${imgs[(i+offset)%imgs.length]}" onerror="this.onerror=null;this.src='${fallback}'" alt="摄影作品 ${i+1}">`).join("");
function phone(s,i){
 const wall=imgs[(i+4)%imgs.length];
 if(s.mode==="hero")return `<div class="device phone"><div class="wall hero-phone" style="background-image:url('${wall}')"></div><div class="shade"></div>${nav(s)}<div class="${s.glass?"glass ":""}hero-caption"><span class="meta">精选系列 · 2026</span><h4 class="title">${s.title}</h4><p>左右轻扫切换作品，向上轻扫查看故事与拍摄参数。</p></div>${bottom(s)}</div>`;
 if(s.mode==="editorial")return `<div class="device phone"><div class="wall" style="background-image:url('${wall}')"></div><div class="shade"></div>${nav(s)}<article class="${s.glass?"glass ":""}editorial-phone"><span class="meta">摄影手记 · 第八期</span><h4 class="title">${s.title}</h4><p>以摄影集方式浏览作品与故事。</p><div class="grid mobile-grid">${pics(4,i)}</div></article>${bottom(s)}</div>`;
 if(s.mode==="sidebar")return `<div class="device phone"><div class="wall" style="background-image:url('${wall}')"></div><div class="shade"></div>${nav(s)}<div class="${s.glass?"glass ":""}filters"><b>全部</b><span>山川</span><span>森林</span><span>湖泊</span></div><div class="${s.glass?"glass ":""}gallery phone-gallery"><div class="grid mobile-grid">${pics(4,i)}</div></div>${bottom(s)}</div>`;
 return `<div class="device phone"><div class="wall" style="background-image:url('${wall}')"></div><div class="shade"></div>${nav(s)}<div class="phone-copy"><span class="meta">精选作品 · 2026</span><h4 class="title">${s.title}</h4></div><div class="${s.glass?"glass ":""}gallery phone-gallery"><div class="grid mobile-grid">${pics(4,i)}</div></div>${bottom(s)}</div>`;
}
function tablet(s,i){
 const wall=imgs[(i+5)%imgs.length];
 const top=`<div class="wall" style="background-image:url('${wall}')"></div><div class="shade"></div><div class="status"><span>9:41</span><span>● ● ▰</span></div><div class="nav"><span class="brand">${s.brand}</span><div class="${s.glass?"glass ":""}segments"><b>作品</b><span>系列</span><span>收藏</span><span>关于</span></div><div class="actions"><span class="round">⌕</span><span class="round">···</span></div></div>`;
 if(s.mode==="hero")return `<div class="device tablet">${top}<div class="body tablet-body"><div class="hero-tablet"><div class="feature"><img src="${imgs[(i+3)%imgs.length]}" onerror="this.onerror=null;this.src='${fallback}'" alt="主视觉作品"><div class="${s.glass?"glass ":""}hero-caption"><span class="meta">本周精选 · 2026</span><h4 class="title">${s.title}</h4></div></div><aside class="${s.glass?"glass ":""}recommend"><div class="grid">${pics(4,i+1)}</div></aside></div></div></div>`;
 if(s.mode==="editorial")return `<div class="device tablet">${top}<div class="body tablet-body"><div class="${s.glass?"glass ":""}editorial-tablet"><div class="story"><div><span class="meta">摄影手记 · 第八期</span><h4 class="title">${s.title}</h4><p>左侧阅读摄影故事，右侧六张作品完整铺满，形成双页摄影集。</p></div><span class="meta">共 24 张照片</span></div><div class="grid tablet-grid">${pics(6,i)}</div></div></div></div>`;
 if(s.mode==="sidebar")return `<div class="device tablet">${top}<div class="body tablet-body"><div class="sidebar-layout"><aside class="${s.glass?"glass ":""}sidebar"><div><span class="meta">智能分类</span><h4>${s.title}</h4><span><b>全部作品</b></span><span>山川</span><span>森林</span><span>湖泊</span><span>海岸</span></div><span class="meta">128 张照片</span></aside><div class="${s.glass?"glass ":""}gallery tablet-gallery"><div class="grid tablet-grid">${pics(8,i)}</div></div></div></div></div>`;
 return `<div class="device tablet">${top}<div class="body tablet-body"><div class="tablet-copy"><div><span class="meta">精选作品 · 2026</span><h4 class="title">${s.title}</h4></div><p>平板以四列网格展示更多作品，顶部导航保持观看区域完整。</p></div><div class="${s.glass?"glass ":""}gallery tablet-gallery"><div class="grid tablet-grid">${pics(8,i)}</div></div></div></div>`;
}
function card(s,i){
 const vars=`--accent:${s.accent};--accentInk:${s.accentInk};--surface:${s.surface};--device:${s.device};--ink:${s.ink};--sub:${s.sub};--panel:${s.panel};--panel2:${s.panel2};--stroke:${s.stroke};--photoRadius:${s.radius};--glow:${s.tags.includes("温暖")||s.light?"#d4ad8c":s.accent}`;
 return `<section class="concept ${s.light?"light":""}" id="style-${i+1}" data-choice="${s.n}" style="${vars}" onclick="choose(this)"><div class="concept-head"><div><span class="num">${String(i+1).padStart(2,"0")}</span><h3>${s.n}</h3><p>${s.d}</p></div><div class="tags">${s.tags.map(x=>`<span class="tag">${x}</span>`).join("")}</div></div><div class="devices">${phone(s,i)}<div class="tablet-wrap">${tablet(s,i)}</div></div><div class="specs"><div class="spec"><b>手机 UX</b><p>${s.mode==="hero"?"全屏主视觉与浮动信息卡。":s.mode==="sidebar"?"分类筛选与 2×2 满铺网格。":s.mode==="editorial"?"编辑卡片与 2×2 满铺网格。":"大标题与 2×2 满铺网格。"}</p></div><div class="spec"><b>平板 UX</b><p>${s.mode==="hero"?"主视觉与 2×2 推荐图并列。":s.mode==="sidebar"?"侧边分类与 4×2 满铺网格。":s.mode==="editorial"?"故事与 3×2 满铺网格并列。":"顶部导航与 4×2 满铺网格。"}</p></div><div class="spec"><b>中文排版</b><p>苹方优先，标题 650 字重，负字距塑造高级感。</p></div><div class="spec"><b>照片展示</b><p>所有网格使用 object-fit: cover，完整填满容器。</p></div></div></section>`;
}
let html="";
["basic","glass","apple"].forEach(g=>{const info=groupInfo[g];html+=`<div class="group-head" id="${info[0]}"><h2>${info[1]}</h2><p>${info[2]}</p></div>`;styles.forEach((s,i)=>{if(s.g===g)html+=card(s,i)})});
document.getElementById("catalog").innerHTML=html;
const captureId=new URLSearchParams(location.search).get("capture")||location.hash.match(/^#capture-(\d+)$/)?.[1];
if(captureId){
  const captureTarget=document.getElementById(`style-${captureId}`);
  document.body.classList.add("capture-mode");
  if(captureTarget)captureTarget.classList.add("capture-target");
}else{
  requestAnimationFrame(()=>{const target=document.getElementById(location.hash.slice(1));if(target)target.scrollIntoView()});
}
function choose(el){document.querySelectorAll(".concept").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");fetch("/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"click",choice:el.dataset.choice,text:el.dataset.choice,timestamp:Date.now()})}).catch(()=>{})}
</script>
</body>
</html>
